<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Fun - Multiplication & Division</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .mode-selection {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .mode-btn.multiplication {
            background: #48bb78;
            color: white;
        }

        .mode-btn.division {
            background: #ed8936;
            color: white;
        }

        .mode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .mode-btn.active {
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.5);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .question-area {
            margin: 30px 0;
            padding: 30px;
            background: #edf2f7;
            border-radius: 15px;
        }

        .question {
            font-size: 3em;
            color: #2d3748;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .answer-input {
            font-size: 2em;
            padding: 15px;
            border: 3px solid #cbd5e0;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            border-color: #667eea;
        }

        .submit-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback.show {
            opacity: 1;
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
        }

        .new-problem-btn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1em;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: none;
        }

        .new-problem-btn:hover {
            background: #38a169;
            transform: scale(1.05);
        }

        .encouragement {
            margin-top: 20px;
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .celebrate {
            animation: bounce 0.5s ease-in-out 2;
        }

        /* Welcome Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-content h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .name-input {
            font-size: 1.5em;
            padding: 15px;
            border: 3px solid #cbd5e0;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .name-input:focus {
            border-color: #667eea;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }

        .start-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .user-greeting {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .session-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .change-name-btn {
            margin-left: 10px;
            padding: 5px 15px;
            font-size: 0.8em;
            background: #ed8936;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .change-name-btn:hover {
            background: #dd6b20;
        }
    </style>
</head>
<body>
    <!-- Welcome Modal -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-content">
            <h2>👋 Welcome to Math Fun!</h2>
            <p>What's your name?</p>
            <input type="text" id="nameInput" class="name-input" placeholder="Enter your name" autocomplete="off" maxlength="30">
            <br>
            <button id="startBtn" class="start-btn" onclick="startSession()">Let's Practice! 🚀</button>
        </div>
    </div>

    <div class="container">
        <h1>🎯 Math Fun! 🎯</h1>
        <div class="user-greeting" id="userGreeting"></div>
        <p class="subtitle">Practice your multiplication and division skills!</p>

        <div class="mode-selection">
            <button class="mode-btn multiplication active" onclick="setMode('multiplication')">
                ✖️ Multiplication
            </button>
            <button class="mode-btn division" onclick="setMode('division')">
                ➗ Division
            </button>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Correct</div>
                <div class="score-value" id="correct">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Total</div>
                <div class="score-value" id="total">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Streak</div>
                <div class="score-value" id="streak">0</div>
            </div>
        </div>

        <div class="question-area">
            <div class="question" id="question">12 × 7 = ?</div>
            <input type="number" class="answer-input" id="answer" placeholder="?" autocomplete="off">
            <br>
            <button class="submit-btn" onclick="checkAnswer()">Check Answer ✓</button>
            <button class="new-problem-btn" id="newProblemBtn" onclick="newProblem()">Next Problem →</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="encouragement" id="encouragement"></div>

        <div class="session-info" id="sessionInfo">
            Session active
            <button class="change-name-btn" onclick="changeName()">Change Name</button>
        </div>
    </div>

    <script>
        let mode = 'multiplication';
        let currentProblem = {};
        let stats = {
            correct: 0,
            total: 0,
            streak: 0
        };
        let userName = '';
        let sessionStartTime = null;

        const encouragements = {
            correct: [
                "Amazing, {name}!",
                "Fantastic work, {name}!",
                "You're doing great, {name}!",
                "Superb, {name}!",
                "Excellent, {name}!",
                "Perfect, {name}!",
                "Well done, {name}!",
                "Outstanding, {name}!"
            ],
            incorrect: [
                "Try again, {name}!",
                "Almost there, {name}!",
                "Keep practicing, {name}!",
                "You can do it, {name}!",
                "Don't give up, {name}!"
            ],
            streak: [
                "{name}, you're on fire!",
                "{name}, you're unstoppable!",
                "Keep it up, {name}!",
                "{name}, you're a streak master!"
            ]
        };

        // Session management functions
        function startSession() {
            const nameInput = document.getElementById('nameInput').value.trim();

            if (nameInput === '') {
                alert('Please enter your name to start!');
                return;
            }

            userName = nameInput;
            sessionStorage.setItem('userName', userName);
            sessionStorage.setItem('sessionStartTime', new Date().toISOString());
            sessionStartTime = new Date();

            // Hide modal and show greeting
            document.getElementById('welcomeModal').classList.add('hidden');
            updateGreeting();
            updateSessionInfo();
            generateProblem();
        }

        function updateGreeting() {
            const greetingEl = document.getElementById('userGreeting');
            const hour = new Date().getHours();
            let timeGreeting = '';

            if (hour < 12) {
                timeGreeting = 'Good morning';
            } else if (hour < 18) {
                timeGreeting = 'Good afternoon';
            } else {
                timeGreeting = 'Good evening';
            }

            greetingEl.textContent = `${timeGreeting}, ${userName}! 👋`;
        }

        function updateSessionInfo() {
            const sessionInfoEl = document.getElementById('sessionInfo');
            const sessionDuration = Math.floor((new Date() - sessionStartTime) / 1000 / 60);
            const accuracy = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;

            sessionInfoEl.innerHTML = `
                Session: ${sessionDuration} min | Accuracy: ${accuracy}% | Problems: ${stats.total}
                <button class="change-name-btn" onclick="changeName()">Change Name</button>
            `;
        }

        function changeName() {
            if (confirm('Are you sure you want to change your name? This will start a new session.')) {
                sessionStorage.clear();
                location.reload();
            }
        }

        function checkSession() {
            const storedName = sessionStorage.getItem('userName');
            const storedStartTime = sessionStorage.getItem('sessionStartTime');

            if (storedName) {
                // Resume existing session
                userName = storedName;
                sessionStartTime = new Date(storedStartTime);
                document.getElementById('welcomeModal').classList.add('hidden');
                updateGreeting();
                updateSessionInfo();
                generateProblem();
            } else {
                // Show welcome modal
                document.getElementById('nameInput').focus();
            }
        }

        function personalizeMessage(message) {
            return message.replace('{name}', userName);
        }

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            newProblem();
        }

        function generateProblem() {
            const num1 = Math.floor(Math.random() * 12) + 1;
            const num2 = Math.floor(Math.random() * 12) + 1;

            if (mode === 'multiplication') {
                currentProblem = {
                    num1: num1,
                    num2: num2,
                    answer: num1 * num2,
                    display: `${num1} × ${num2} = ?`
                };
            } else {
                const product = num1 * num2;
                currentProblem = {
                    num1: product,
                    num2: num1,
                    answer: num2,
                    display: `${product} ÷ ${num1} = ?`
                };
            }

            document.getElementById('question').textContent = currentProblem.display;
            document.getElementById('answer').value = '';
            document.getElementById('answer').focus();
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('newProblemBtn').style.display = 'none';
            document.getElementById('encouragement').textContent = '';
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedbackEl = document.getElementById('feedback');
            const encouragementEl = document.getElementById('encouragement');
            const submitBtn = document.querySelector('.submit-btn');

            if (isNaN(userAnswer)) {
                feedbackEl.textContent = '⚠️ Please enter a number!';
                feedbackEl.className = 'feedback incorrect show';
                return;
            }

            stats.total++;
            document.getElementById('total').textContent = stats.total;

            if (userAnswer === currentProblem.answer) {
                stats.correct++;
                stats.streak++;
                feedbackEl.textContent = `✅ Correct! ${currentProblem.display.replace('?', currentProblem.answer)}`;
                feedbackEl.className = 'feedback correct show';

                const randomEncouragement = encouragements.correct[Math.floor(Math.random() * encouragements.correct.length)];
                encouragementEl.textContent = '🌟 ' + personalizeMessage(randomEncouragement);

                if (stats.streak >= 3) {
                    const streakMsg = encouragements.streak[Math.floor(Math.random() * encouragements.streak.length)];
                    encouragementEl.textContent += ' ' + personalizeMessage(streakMsg);
                }

                document.querySelector('.container').classList.add('celebrate');
                setTimeout(() => {
                    document.querySelector('.container').classList.remove('celebrate');
                }, 1000);
            } else {
                stats.streak = 0;
                feedbackEl.textContent = `❌ Not quite. The answer is ${currentProblem.answer}`;
                feedbackEl.className = 'feedback incorrect show';

                const randomEncouragement = encouragements.incorrect[Math.floor(Math.random() * encouragements.incorrect.length)];
                encouragementEl.textContent = '💭 ' + personalizeMessage(randomEncouragement);
            }

            document.getElementById('correct').textContent = stats.correct;
            document.getElementById('streak').textContent = stats.streak;
            document.getElementById('newProblemBtn').style.display = 'inline-block';
            updateSessionInfo();
        }

        function newProblem() {
            generateProblem();
        }

        // Allow Enter key to submit answer
        document.getElementById('answer').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                if (document.getElementById('newProblemBtn').style.display === 'none') {
                    checkAnswer();
                } else {
                    newProblem();
                }
            }
        });

        // Allow Enter key in name input
        document.getElementById('nameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                startSession();
            }
        });

        // Check for existing session on page load
        window.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });
    </script>
</body>
</html>
